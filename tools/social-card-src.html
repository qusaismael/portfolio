<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>qusai.pro — Quiet Edition Social Card Source</title>
<style>
@font-face { font-family: 'Fraunces'; src: url('../src/fonts/fraunces-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; font-style: normal; }
@font-face { font-family: 'Fraunces'; src: url('../src/fonts/fraunces-latin-wght-italic.woff2') format('woff2'); font-weight: 100 900; font-style: italic; }
@font-face { font-family: 'IBM Plex Sans'; src: url('../src/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'IBM Plex Mono'; src: url('../src/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-style: normal; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1200px; height: 630px; overflow: hidden;
  background: #1A0F0A; color: #E8DFD0;
  font-family: 'IBM Plex Sans', sans-serif;
  padding: 58px 72px 52px;
  display: grid; grid-template-rows: auto 1fr auto;
}
.top {
  display: flex; align-items: baseline; justify-content: space-between;
  border-bottom: 1px solid #4F382A; padding-bottom: 24px;
}
.mark {
  font: 640 34px/1 'Fraunces', Georgia, serif; letter-spacing: -0.05em; color: #FAF0E6;
}
.mark span { color: #FF8A4C; }
.meta {
  font: 400 17px/1 'IBM Plex Mono', monospace; letter-spacing: 0.08em; color: #BFB09B;
  text-transform: uppercase;
}
.mid {
  display: grid; grid-template-columns: 1fr 276px; gap: 56px; align-items: center;
}
h1 {
  font: 480 86px/0.96 'Fraunces', Georgia, serif;
  font-variation-settings: "SOFT" 45, "opsz" 144;
  letter-spacing: -0.045em; color: #FAF0E6; margin-bottom: 24px;
}
h1 em { font-style: italic; font-weight: 420; }
h1 span { color: #FF8A4C; }
.lede {
  font: 380 30px/1.35 'Fraunces', Georgia, serif; color: #E8DFD0; max-width: 24ch;
}
.portrait-wrap {
  width: 268px; height: 268px; border-radius: 50%; overflow: hidden;
  border: 1px solid #4F382A; outline: 1px solid #F0A36B; outline-offset: 8px;
  justify-self: end;
}
.portrait-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bottom {
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid #4F382A; padding-top: 22px;
  font: 400 18px/1 'IBM Plex Mono', monospace; color: #BFB09B; letter-spacing: 0.04em;
}
.bottom .url { color: #FAF0E6; }
.bottom .url span { color: #FF8A4C; }
</style>
</head>
<body>
  <header class="top">
    <div class="mark">QI<span>.</span></div>
    <div class="meta">Jordan · Security, Privacy &amp; Local AI</div>
  </header>
  <main class="mid">
    <div>
      <h1>Hi, I’m <em>Qusai</em><span>.</span></h1>
      <p class="lede">Security, privacy, and things I build.</p>
    </div>
    <div class="portrait-wrap">
      <img src="../src/pfp-440.webp" alt="Qusai Ismael">
    </div>
  </main>
  <footer class="bottom">
    <span>PRIVACY &amp; GRC ENGINEER</span>
    <span class="url">www.qusai.pro <span>↗</span></span>
  </footer>
</body>
</html>
